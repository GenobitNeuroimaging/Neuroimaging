[project]
name = "Neuroimaging"
version = "0.1.0"
description = ""
authors = [
    { name = "Diego Nicolas Gomez Martinez", email = "a00845905@tec.mx"
    name = "Mateo Rodolfo Flores Torres", email = "a01783438@tec.mx"
    name = "Emiliano Hervert de la Cruz", email = "a01412606@tec.mx"
    name = "Angel Eduardo Luna Leija", email = "a00842657@tec.mx"
    name = "Azul Fernanda Paniagua Bucio", email = "a01424351@tec.mx"
    name = "Andrea Estefanía de la Peña Contreras", email = "a00840973@tec.mx" }
    ]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "nibabel>=5.4.2",
    "numpy>=2.4.6",
]

[project.scripts]
Neuroimaging = "Neuroimaging.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipython>=9.17.1",
]
